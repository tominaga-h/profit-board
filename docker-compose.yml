services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      # Nuxt の dev サーバは既定で localhost にバインドするため、
      # コンテナ外（ホスト）からポートフォワードで届かない。0.0.0.0 が必須。
      HOST: "0.0.0.0"
      PORT: "3000"
    volumes:
      - .:/app
    command: sh -c "[ -d node_modules/nuxt ] || npm ci; npm run dev"

volumes:
  node_modules:
